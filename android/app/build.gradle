plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// 1. Read the key.properties file
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    println "loaded prop file"
}

android {
    namespace = "com.metait.fepubreader"
    compileSdk = 37
    println("compileSdk="+compileSdk);
    ndkVersion = flutter.ndkVersion

    // 2. Add the signingConfigs block
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled = true
    }



    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.metait.fepubreader"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        println("minSdk="+minSdk);
        targetSdk = flutter.targetSdkVersion
        println("targetSdk="+targetSdk);
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            // signingConfig = signingConfigs.debug
            // 3. Apply the signing config to the release build type.
            signingConfig = signingConfigs.release
        }
    }
}


dependencies {
        implementation 'com.google.android.material:material:1.14.0'
        implementation "androidx.fragment:fragment:1.9.1"
        coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
        implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
        implementation 'com.github.albfernandez:juniversalchardet:2.5.0'
}

flutter {
    source = "../.."
}
