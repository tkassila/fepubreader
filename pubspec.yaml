name: fepubreader
description: "1 or 2 view of pdf or epub file on android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  path: ^1.9.1
  epubx: ^4.0.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  crypto: ^3.0.6
  file_selector: ^1.1.0
  file_picker: ^11.0.2
  flutter_html: ^3.0.0
  flutter_html_all: ^3.0.0
  flutter_pdfview: ^1.4.4
  pdf_thumbnail: ^0.1.6+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
